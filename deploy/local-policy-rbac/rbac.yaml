---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stackrox-local-policy-manager
rules:
- apiGroups: ["policy.stackrox.io"]
  resources: ["stackroxpolicies", "clusterstackroxpolicies"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["policy.stackrox.io"]
  resources: ["stackroxpolicies/status", "clusterstackroxpolicies/status"]
  verbs: ["update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stackrox-sensor-local-policy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: stackrox-local-policy-manager
subjects:
- kind: ServiceAccount
  name: sensor
  namespace: stackrox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stackrox-admission-control-local-policy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: stackrox-local-policy-manager
subjects:
- kind: ServiceAccount
  name: admission-control
  namespace: stackrox
